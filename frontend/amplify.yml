version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  customHeaders:
    - pattern: '/api/chat'
      headers:
        - key: 'X-Accel-Buffering'
          value: 'no'
        - key: 'Cache-Control'
          value: 'no-cache'
        - key: 'Connection'
          value: 'keep-alive'
        - key: 'Transfer-Encoding'
          value: 'chunked'
